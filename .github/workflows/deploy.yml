name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute remote deployment pipeline over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting FinBoard deployment on Oracle Cloud..."
            cd ~/finboard

            echo "📥 Pulling latest changes from git..."
            git pull origin master

            echo "📦 Installing PHP dependencies with Composer..."
            docker compose -f docker-compose.prod.yml run --rm --user root app composer install --optimize-autoloader --no-dev

            echo "🎨 Compiling Vite frontend assets..."
            docker run --rm -v $(pwd):/app -w /app node:20-alpine sh -c "npm ci && npm run build"

            echo "🔒 Ensuring storage and cache permissions..."
            sudo chmod -R 777 storage bootstrap/cache public

            echo "🐳 Updating Docker containers..."
            docker compose -f docker-compose.prod.yml up -d --build

            echo "🗄️ Running database migrations..."
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force

            echo "⚡ Refreshing application cache..."
            docker compose -f docker-compose.prod.yml exec -T app php artisan optimize:clear
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan view:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan queue:restart

            echo "✅ FinBoard deployment completed successfully!"
