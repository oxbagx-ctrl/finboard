services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    container_name: finboard-app
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stack
      LOG_LEVEL: info
    networks:
      - finboard-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: nginx:1.25-alpine
    container_name: finboard-web
    restart: always
    ports:
      - "${FORWARD_HTTP_PORT:-80}:80"
      - "${FORWARD_HTTPS_PORT:-443}:443"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - finboard-network
    depends_on:
      - app
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    container_name: finboard-worker
    restart: always
    working_dir: /var/www/html
    command: php artisan queue:work --queue=financial-imports,default --verbose --tries=3 --timeout=180 --sleep=3 --max-jobs=1000 --max-time=3600
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    networks:
      - finboard-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    container_name: finboard-scheduler
    restart: always
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    networks:
      - finboard-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: finboard-postgres
    restart: always
    ports:
      - "${FORWARD_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-finboard}
      POSTGRES_USER: ${DB_USERNAME:-finboard_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finboard_secret}
    volumes:
      - finboard-pgdata:/var/lib/postgresql/data
    networks:
      - finboard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-finboard_user} -d ${DB_DATABASE:-finboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: finboard-redis
    restart: always
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-finboard_redis_secret}
    volumes:
      - finboard-redisdata:/data
    networks:
      - finboard-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-finboard_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  finboard-network:
    driver: bridge

volumes:
  finboard-pgdata:
    driver: local
  finboard-redisdata:
    driver: local
